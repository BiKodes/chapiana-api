version: 3"
services:

    postgres:
      image: postgres
      restart: always
      environment:
        POSTGRES_USER: "${DB_USER}"
        POSTGRES_PASSWORD: "${DB_PASS}"
        POSTGRES_DB: "${DB_NAME}"
      ports:
        - "5432:5432"
      volumes:
        - postgresql-data:/var/lib/postgresql/data
        - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      networks:
        - helio -network

    pgadmin:
      image: dpage/pgadmin4
      environment:
        PGADMIN_DEFAULT_EMAIL: "bikocodes@gmail.com"
        PGADMIN_DEFAULT_PASSWORD: "kejani"
      ports:
        - "8080:80"
      depends_on:
        - postgres
      volumes:
        - pgadmin-data:/var/lib/pgadmin
      networks:
        - helio-network

    api:
      build: ./
      command: >
        bash -c "python wait_for_postgres.py &&
                ./manage.py migrate &&
                ./manage.py runserver 0.0.0.0:8000"
      depends_on:
      - postgres
      environment:
      - DJANGO_SECRET_KEY: "local"
      ports:
        - "8000:8000"
      restart: unless-stopped
      volumes:
        - ./:/code
      networks:
        - helio-network

    helios:
      build:
        dockerfile: docker/Dockerfile
        context: ./
      command: python manage.py runserver 0.0.0.0:8000
      depends_on:
        - postgres
      environment:
        - POSTGRES_HOST="postgres"
        - CELERY_BROKER_URL="amqp://rabbitmq"
      ports:
        - "8000:8000"
      networks:
        - helio-network
      restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
      stop_grace_period: "${DOCKER_STOP_GRACE_PERIOD:-3s}"
      volumes:
        - ./:/app

    redis:
      restart: always
      image: redis:latest
      command:
      - --loglevel warning
      volumes:
      - redis-data:/data:Z
      networks:
        - helio-network

    nginx:
      restart: always
      build: ./nginx/
      ports:
        - "80:80"
      volumes:
        - web-static:/www/static
      links:
        - web:web

networks:
  helio-network:
    driver: bridge

volumes:
  redis-data:
  postgresql-data:
  pgadmin-data:
